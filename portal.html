<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal de Projetos — ATRIA Corp</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#EDEEE9}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
input::placeholder{color:rgba(11,31,40,.28)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(11,31,40,.15);border-radius:4px}
button:hover{opacity:.9}
</style>
</head>
<body>
<div id="root"></div>
<script>
const e=React.createElement;
const API_URL='https://script.google.com/macros/s/AKfycbxy8yktI28t32uD7sxpkv0uUTe6wgNO1ho03XOVnDYkxRWy4fVZ0wEY1zh7O8VhofBLeg/exec';

function App(){
  const [screen,setScreen]=React.useState('login');
  const [token,setToken]=React.useState('');
  const [error,setError]=React.useState('');
  const [data,setData]=React.useState(null);
  const [filter,setFilter]=React.useState('all');
  const [loading,setLoading]=React.useState(false);

  // Check URL for token param
  React.useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    const t=p.get('token');
    if(t){setToken(t);setLoading(true);
      // Fetch data from Apps Script API
      fetch(API_URL+'?token='+encodeURIComponent(t))
        .then(r=>r.text())
        .then(html=>{
          // Extract DATA_PROPS from the HTML
          const m=html.match(/var DATA_PROPS\s*=\s*({[\s\S]*?});/);
          if(m){
            const dp=JSON.parse(m[1]);
            if(dp.error){setScreen('error');setError(dp);}
            else{setData(dp);setScreen('dashboard');}
          }else{setScreen('error');setError({errorTitle:'Erro',errorMessage:'Não foi possível carregar os dados.'});}
          setLoading(false);
        })
        .catch(()=>{setScreen('error');setError({errorTitle:'Erro',errorMessage:'Falha na conexão.'});setLoading(false);});
    }
  },[]);

  function handleLogin(){
    const t=token.trim();
    if(!t){setError('Preencha o token.');return;}
    // Open the Apps Script page with token — this works because it redirects the whole browser
    setLoading(true);
      fetch('/api?token='+encodeURIComponent(t))
        .then(r=>r.json())
        .then(dp=>{
          setLoading(false);
          if(dp.error){setScreen('error');setError(dp);}
          else{setData(dp);setScreen('dashboard');}
        })
        .catch(()=>{setLoading(false);setScreen('error');setError({errorTitle:'Erro',errorMessage:'Falha na conexão. Tente novamente.'});});
  }

  function handleKeyDown(e){if(e.key==='Enter')handleLogin();}

  // ── LOADING ──
  if(loading){
    return e('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:20,background:'#FFFFFF'}},
      e('div',{style:{width:40,height:40,border:'3px solid rgba(11,31,40,.1)',borderTopColor:'#0B1F28',borderRadius:'50%',animation:'spin .8s linear infinite'}}),
      e('p',{style:{fontSize:14,color:'#9A9A90'}},'Carregando…')
    );
  }

  // ── ERROR ──
  if(screen==='error'){
    return e('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#FFFFFF'}},
      e('div',{style:{textAlign:'center',maxWidth:420,padding:40,animation:'fadeIn .4s ease both'}},
        e('div',{style:{width:64,height:64,borderRadius:'50%',background:'#FEF0EE',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 24px'}},
          e('span',{style:{fontSize:28}},'🔒')
        ),
        e('h2',{style:{fontSize:22,fontWeight:700,color:'#0B1F28',margin:'0 0 10px'}},error.errorTitle||'Acesso Negado'),
        e('p',{style:{fontSize:14,color:'#8C8C84',margin:'0 0 32px',lineHeight:1.65}},error.errorMessage||'O token de acesso é inválido ou foi revogado.'),
        e('a',{href:window.location.pathname,style:{display:'inline-block',padding:'10px 24px',background:'#0B1F28',color:'#fff',borderRadius:8,textDecoration:'none',fontSize:13,fontWeight:600}},'Tentar novamente')
      )
    );
  }

  // ── DASHBOARD ──
  if(screen==='dashboard'&&data){
    const tasks=data.tasks||[];
    const projectName=data.projectName||'Projeto';
    const footerClient=data.footerClient||'';
    const STATUS_CFG={
      'Concluído':{bg:'#EBF5EB',color:'#1B6B20',dot:'#28A745'},'concluido':{bg:'#EBF5EB',color:'#1B6B20',dot:'#28A745'},'complete':{bg:'#EBF5EB',color:'#1B6B20',dot:'#28A745'},
      'Em andamento':{bg:'#EBF2FD',color:'#1650A0',dot:'#2563EB'},'in progress':{bg:'#EBF2FD',color:'#1650A0',dot:'#2563EB'},'in_progress':{bg:'#EBF2FD',color:'#1650A0',dot:'#2563EB'},
      'Atrasado':{bg:'#FEF0EE',color:'#C41C1C',dot:'#DC2626'},'atrasado':{bg:'#FEF0EE',color:'#C41C1C',dot:'#DC2626'},'overdue':{bg:'#FEF0EE',color:'#C41C1C',dot:'#DC2626'},
      'Pendente':{bg:'#F5F4EE',color:'#7B7554',dot:'#9E9A72'},'pendente':{bg:'#F5F4EE',color:'#7B7554',dot:'#9E9A72'},'open':{bg:'#F5F4EE',color:'#7B7554',dot:'#9E9A72'},
      'Em revisão':{bg:'#FFF3E0',color:'#E65100',dot:'#FF9800'},'review':{bg:'#FFF3E0',color:'#E65100',dot:'#FF9800'},
      'Bloqueado':{bg:'#F3E5F5',color:'#7B1FA2',dot:'#9C27B0'},'blocked':{bg:'#F3E5F5',color:'#7B1FA2',dot:'#9C27B0'}
    };
    const AVATAR_COLORS=['#0B1F28','#7B7554','#1565C0','#2E7D32','#C62828','#6A1B9A','#00695C','#BF360C'];

    const normalize=tasks.map((t,i)=>{
      const s=(t.status||'').toLowerCase().trim();
      const map={'complete':'Concluído','done':'Concluído','concluido':'Concluído','in progress':'Em andamento','in_progress':'Em andamento','pending':'Pendente','to do':'Pendente','open':'Pendente','overdue':'Atrasado','atrasado':'Atrasado','review':'Em revisão','blocked':'Bloqueado'};
      return{...t,status:map[s]||t.status||'Pendente',initials:(t.responsible||'??').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)||'??',_i:i};
    });
    const filtered=filter==='all'?normalize:normalize.filter(t=>t.status===filter);
    const total=normalize.length,done=normalize.filter(t=>t.status==='Concluído').length,ip=normalize.filter(t=>t.status==='Em andamento').length,pend=normalize.filter(t=>t.status==='Pendente').length,ovd=normalize.filter(t=>t.status==='Atrasado').length;
    const pct=total>0?Math.round(normalize.reduce((s,t)=>s+(t.progress||0),0)/total):0;

    const R=70,C=2*Math.PI*R,off=C-(pct/100)*C;
    const ring=e('svg',{width:160,height:160,viewBox:'0 0 160 160'},
      e('circle',{cx:80,cy:80,r:R,fill:'none',stroke:'rgba(11,31,40,.07)',strokeWidth:10}),
      e('circle',{cx:80,cy:80,r:R,fill:'none',stroke:'#0B1F28',strokeWidth:10,strokeDasharray:C,strokeDashoffset:off,strokeLinecap:'round',transform:'rotate(-90 80 80)',style:{transition:'stroke-dashoffset 1.3s cubic-bezier(.4,0,.2,1)'}}),
      e('circle',{cx:80,cy:80,r:R,fill:'none',stroke:'#7B7554',strokeWidth:10,strokeDasharray:C*.1+' '+C*.9,strokeLinecap:'round',transform:'rotate(-90 80 80)',opacity:.35}),
      e('text',{x:80,y:76,textAnchor:'middle',fontSize:28,fontWeight:700,fill:'#0B1F28',fontFamily:'Inter,system-ui'},pct+'%'),
      e('text',{x:80,y:95,textAnchor:'middle',fontSize:10.5,fill:'#7B7554',fontFamily:'Inter,system-ui',fontWeight:600,letterSpacing:.8},'PROGRESSO GERAL'));

    // Phases dynamic
    const pg={};
    normalize.forEach(t=>{const p=t.phase||'Sem fase';if(!pg[p])pg[p]={tasks:[],doneN:0};pg[p].tasks.push(t);if(t.status==='Concluído')pg[p].doneN++;});
    const pc=['#28A745','#2563EB','#FF9800','#9C27B0','#00BCD4','#795548','#607D8B','#E91E63'];
    const phases=Object.entries(pg).map(([l,g],i)=>({label:l,pct:g.tasks.length>0?Math.round(g.doneN/g.tasks.length*100):0,pctStr:(g.tasks.length>0?Math.round(g.doneN/g.tasks.length*100):0)+'%',tasksStr:g.doneN+'/'+g.tasks.length+' tarefas',barStyle:{width:(g.tasks.length>0?Math.round(g.doneN/g.tasks.length*100):0)+'%',height:'100%',background:pc[i%pc.length],borderRadius:3}}));

    const now=new Date();
    const todayStr=now.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})+' • '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

    const FILTERS=[{key:'all',label:'Todas',count:total},{key:'Em andamento',label:'Em andamento',count:ip},{key:'Concluído',label:'Concluídas',count:done},{key:'Pendente',label:'Pendentes',count:pend},{key:'Atrasado',label:'Atrasadas',count:ovd}];

    return e('div',{style:{minHeight:'100vh',background:'#EDEEE9'}},
      // HEADER
      e('div',{style:{position:'sticky',top:0,zIndex:100,background:'#0B1F28',minHeight:62,display:'flex',alignItems:'center',padding:'0 32px',gap:20,boxShadow:'0 2px 10px rgba(0,0,0,.28)',flexWrap:'wrap'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:10}},
          e('span',{style:{color:'#7B7554',fontSize:14,fontWeight:700,letterSpacing:1}},'ATRIA'),
          e('div',{style:{width:1,height:20,background:'rgba(255,255,255,.1)'}})
        ),
        e('div',{style:{flex:1}},
          e('p',{style:{color:'rgba(255,255,255,.36)',fontSize:9,letterSpacing:2,textTransform:'uppercase',margin:'0 0 2px',fontWeight:700}},'Projeto'),
          e('p',{style:{color:'#fff',fontSize:13.5,fontWeight:500,margin:0}},projectName)
        ),
        e('div',{style:{display:'flex',alignItems:'center',gap:7,padding:'5px 13px',background:'rgba(255,255,255,.06)',borderRadius:20}},
          e('div',{style:{width:7,height:7,borderRadius:'50%',background:'#28A745',animation:'pulse 2s ease infinite'}}),
          e('span',{style:{fontSize:11,color:'rgba(255,255,255,.65)',fontWeight:500}},'Ao vivo')
        ),
        e('div',{style:{textAlign:'right'}},
          e('p',{style:{color:'rgba(255,255,255,.32)',fontSize:9,letterSpacing:1.5,textTransform:'uppercase',margin:'0 0 2px',fontWeight:700}},'Atualização'),
          e('p',{style:{color:'rgba(255,255,255,.72)',fontSize:11.5,margin:0}},todayStr)
        ),
        e('button',{onClick:()=>window.location.href=window.location.pathname,style:{border:'1px solid rgba(255,255,255,.16)',background:'transparent',color:'rgba(255,255,255,.6)',padding:'7px 16px',borderRadius:7,fontSize:12,cursor:'pointer',fontFamily:'Inter,system-ui',fontWeight:500}},'Sair')
      ),
      // CONTENT
      e('div',{style:{maxWidth:1420,margin:'0 auto',padding:'28px 32px 52px'}},
        // Top cards
        e('div',{style:{display:'grid',gridTemplateColumns:'220px 1fr 292px',gap:16,marginBottom:18}},
          e('div',{style:{background:'#fff',borderRadius:14,padding:'24px 20px',boxShadow:'0 1px 3px rgba(11,31,40,.07)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4}},ring,
            e('p',{style:{fontSize:11,color:'#9A9A90',marginTop:10,textAlign:'center',lineHeight:1.5}},done,' de ',total,' tarefas',e('br'),'concluídas')
          ),
          e('div',{style:{background:'#fff',borderRadius:14,padding:24,boxShadow:'0 1px 3px rgba(11,31,40,.07)'}},
            e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}},
              e('p',{style:{fontSize:11,fontWeight:700,color:'#9A9A90',letterSpacing:1.2,textTransform:'uppercase',margin:0}},'Resumo das Tarefas'),
              e('span',{style:{fontSize:11,color:'#9A9A90',background:'rgba(11,31,40,.05)',padding:'3px 10px',borderRadius:12,fontWeight:500}},total,' no total')
            ),
            e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}},
              e('div',{style:{padding:'16px 18px',background:'#EBF5EB',borderRadius:10}},e('p',{style:{fontSize:34,fontWeight:700,color:'#1B6B20',margin:'0 0 4px',lineHeight:1}},done),e('p',{style:{fontSize:12,color:'#1B6B20',margin:0,fontWeight:500}},'Concluídas')),
              e('div',{style:{padding:'16px 18px',background:'#EBF2FD',borderRadius:10}},e('p',{style:{fontSize:34,fontWeight:700,color:'#1650A0',margin:'0 0 4px',lineHeight:1}},ip),e('p',{style:{fontSize:12,color:'#1650A0',margin:0,fontWeight:500}},'Em andamento')),
              e('div',{style:{padding:'16px 18px',background:'#FEF0EE',borderRadius:10}},e('p',{style:{fontSize:34,fontWeight:700,color:'#C41C1C',margin:'0 0 4px',lineHeight:1}},ovd),e('p',{style:{fontSize:12,color:'#C41C1C',margin:0,fontWeight:500}},'Atrasadas')),
              e('div',{style:{padding:'16px 18px',background:'#F5F4EE',borderRadius:10}},e('p',{style:{fontSize:34,fontWeight:700,color:'#7B7554',margin:'0 0 4px',lineHeight:1}},pend),e('p',{style:{fontSize:12,color:'#7B7554',margin:0,fontWeight:500}},'Pendentes'))
            )
          ),
          e('div',{style:{background:'#fff',borderRadius:14,padding:24,boxShadow:'0 1px 3px rgba(11,31,40,.07)'}},
            e('p',{style:{fontSize:11,fontWeight:700,color:'#9A9A90',letterSpacing:1.2,textTransform:'uppercase',margin:'0 0 22px'}},'Fases'),
            phases.map(p=>e('div',{key:p.label,style:{marginBottom:20}},
              e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:7}},
                e('span',{style:{fontSize:12.5,fontWeight:500,color:'#0B1F28'}},p.label),
                e('span',{style:{fontSize:12,fontWeight:700,color:'#0B1F28'}},p.pctStr)
              ),
              e('div',{style:{height:6,background:'rgba(11,31,40,.07)',borderRadius:3,overflow:'hidden',marginBottom:5}},e('div',{style:p.barStyle})),
              e('span',{style:{fontSize:11,color:'#9A9A90'}},p.tasksStr)
            ))
          )
        ),
        // TABLE
        e('div',{style:{background:'#fff',borderRadius:14,overflow:'hidden',boxShadow:'0 1px 3px rgba(11,31,40,.07)'}},
          e('div',{style:{padding:'16px 20px',borderBottom:'1px solid rgba(11,31,40,.07)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}},
            e('div',null,
              e('p',{style:{fontSize:14,fontWeight:600,color:'#0B1F28',margin:'0 0 2px'}},'Atividades do Projeto'),
              e('p',{style:{fontSize:11.5,color:'#9A9A90',margin:0}},'Filtre por status')
            ),
            e('div',{style:{display:'flex',alignItems:'center',gap:3,background:'rgba(11,31,40,.04)',borderRadius:9,padding:4,flexWrap:'wrap'}},
              FILTERS.map(f=>e('button',{key:f.key,onClick:()=>setFilter(f.key),style:{display:'flex',alignItems:'center',gap:7,padding:'7px 13px',borderRadius:6,fontSize:12.5,fontWeight:filter===f.key?600:400,color:filter===f.key?'#fff':'#6B6B62',background:filter===f.key?'#0B1F28':'transparent',border:'none',cursor:'pointer',fontFamily:'Inter,system-ui'}},f.label,e('span',{style:{background:filter===f.key?'rgba(255,255,255,.2)':'rgba(11,31,40,.08)',color:filter===f.key?'rgba(255,255,255,.85)':'#8A8A80',fontSize:10.5,fontWeight:700,padding:'1px 6px',borderRadius:10}},f.count)))
            )
          ),
          e('div',{style:{display:'flex',alignItems:'center',padding:'9px 20px',background:'#F8F9F6',borderBottom:'1px solid rgba(11,31,40,.07)',gap:16}},
            e('div',{style:{width:72,flexShrink:0,fontSize:10,fontWeight:700,color:'#9A9A90',letterSpacing:1,textTransform:'uppercase'}},'Fase'),
            e('div',{style:{flex:1,minWidth:0,fontSize:10,fontWeight:700,color:'#9A9A90',letterSpacing:1,textTransform:'uppercase'}},'Atividade'),
            e('div',{style:{width:165,flexShrink:0,fontSize:10,fontWeight:700,color:'#9A9A90',letterSpacing:1,textTransform:'uppercase'}},'Responsável'),
            e('div',{style:{width:96,flexShrink:0,fontSize:10,fontWeight:700,color:'#9A9A90',letterSpacing:1,textTransform:'uppercase'}},'Prazo'),
            e('div',{style:{width:140,flexShrink:0,fontSize:10,fontWeight:700,color:'#9A9A90',letterSpacing:1,textTransform:'uppercase'}},'Status'),
            e('div',{style:{width:134,flexShrink:0,fontSize:10,fontWeight:700,color:'#9A9A90',letterSpacing:1,textTransform:'uppercase'}},'Progresso')
          ),
          filtered.length===0?
            e('div',{style:{padding:'60px 20px',textAlign:'center'}},e('p',{style:{fontSize:26,margin:'0 0 14px'}},'📋'),e('p',{style:{fontSize:14,fontWeight:600,color:'#0B1F28',margin:'0 0 6px'}},'Nenhuma tarefa encontrada'),e('p',{style:{fontSize:13,color:'#9A9A90',margin:0}},'Não há tarefas com o status selecionado.'))
          : filtered.map(t=>{
            const sc=STATUS_CFG[t.status]||STATUS_CFG['Pendente'];
            return e('div',{key:t.id,style:{display:'flex',alignItems:'center',padding:'13px 20px',borderBottom:'1px solid rgba(11,31,40,.05)',gap:16,background:'#fff'}},
              e('div',{style:{width:72,flexShrink:0}},e('span',{style:{fontSize:10,fontWeight:600,color:'#7B7554',background:'rgba(123,117,84,.1)',padding:'3px 8px',borderRadius:10,whiteSpace:'nowrap'}},t.phase)),
              e('div',{style:{flex:1,minWidth:0}},e('p',{style:{fontSize:13,fontWeight:500,color:'#0B1F28',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',margin:0}},t.name)),
              e('div',{style:{width:165,flexShrink:0,display:'flex',alignItems:'center',gap:8,overflow:'hidden'}},
                e('div',{style:{width:26,height:26,borderRadius:'50%',background:AVATAR_COLORS[t._i%AVATAR_COLORS.length],display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff',flexShrink:0}},t.initials),
                e('span',{style:{fontSize:12,color:'#6B6B62',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},t.responsible)
              ),
              e('div',{style:{width:96,flexShrink:0}},e('p',{style:{fontSize:12,color:'#6B6B62',margin:0}},t.dueDate)),
              e('div',{style:{width:140,flexShrink:0}},e('span',{style:{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:20,fontSize:11.5,fontWeight:500,whiteSpace:'nowrap',background:sc.bg,color:sc.color}},e('span',{style:{display:'inline-block',width:6,height:6,borderRadius:'50%',background:sc.dot,flexShrink:0}}),t.status)),
              e('div',{style:{width:134,flexShrink:0,display:'flex',alignItems:'center',gap:8}},e('div',{style:{flex:1,height:5,background:'rgba(11,31,40,.08)',borderRadius:3,overflow:'hidden'}},e('div',{style:{width:(t.progress||0)+'%',height:'100%',background:t.status==='Atrasado'?'#DC2626':t.status==='Concluído'?'#28A745':'#0B1F28',borderRadius:3}})),e('span',{style:{fontSize:11,fontWeight:600,color:'#0B1F28',minWidth:30,textAlign:'right'}},(t.progress||0)+'%'))
            );
          })
        ),
        e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:22,padding:'0 2px'}},
          e('p',{style:{fontSize:11,color:'#AAAAA2',margin:0}},footerClient,' · ATRIA Corp · Acesso somente leitura'),
          e('div',{style:{display:'flex',alignItems:'center',gap:6}},e('div',{style:{width:5,height:5,borderRadius:'50%',background:'#28A745',animation:'pulse 2s ease infinite'}}),e('p',{style:{fontSize:11,color:'#AAAAA2',margin:0}},'Sincronizado com ClickUp'))
        )
      )
    );
  }

  // ── LOGIN ──
  return e('div',{style:{minHeight:'100vh',display:'flex'}},
    e('div',{style:{width:'44%',minHeight:'100vh',background:'#0B1F28',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',padding:64,position:'relative',overflow:'hidden'}},
      e('div',{style:{position:'absolute',inset:0,backgroundImage:'radial-gradient(rgba(123,117,84,.14) 1px,transparent 1px)',backgroundSize:'26px 26px',pointerEvents:'none'}}),
      e('div',{style:{position:'relative',zIndex:1,textAlign:'center',animation:'fadeIn .7s ease both'}},
        e('div',{style:{color:'#fff',fontSize:18,fontWeight:700,letterSpacing:3,marginBottom:48}},'ATRIA'),
        e('div',{style:{width:28,height:1.5,background:'#7B7554',margin:'0 auto 28px'}}),
        e('p',{style:{color:'rgba(255,255,255,.32)',fontSize:10.5,letterSpacing:3.5,textTransform:'uppercase',margin:'0 0 10px',fontWeight:600}},'Portal de'),
        e('h1',{style:{color:'#FFFFFF',fontSize:25,fontWeight:300,lineHeight:1.45,letterSpacing:-0.4,margin:'0 0 36px'}},'Acompanhamento',e('br'),'de Projetos'),
        e('p',{style:{color:'rgba(255,255,255,.28)',fontSize:12.5,lineHeight:1.75,maxWidth:230,margin:'0 auto'}},'Visualização em tempo real do andamento dos seus projetos, via ClickUp.')
      )
    ),
    e('div',{style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:64,background:'#FFFFFF'}},
      e('div',{style:{width:'100%',maxWidth:370,animation:'fadeIn .55s ease .12s both'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:44}},
          e('div',{style:{width:7,height:7,borderRadius:'50%',background:'#7B7554'}}),
          e('span',{style:{fontSize:10.5,fontWeight:700,color:'#7B7554',letterSpacing:2.5,textTransform:'uppercase'}},'Acesso Seguro')
        ),
        e('h2',{style:{fontSize:27,fontWeight:700,color:'#0B1F28',margin:'0 0 8px',letterSpacing:-0.6}},'Bem-vindo'),
        e('p',{style:{fontSize:14,color:'#8C8C84',margin:'0 0 40px',lineHeight:1.65}},'Insira o token de acesso fornecido pela equipe ATRIA Corp.'),
        e('label',{style:{display:'block',fontSize:10.5,fontWeight:700,color:'#0B1F28',letterSpacing:1.2,textTransform:'uppercase',marginBottom:8}},'Token de Acesso'),
        e('input',{type:'text',placeholder:'Ex: a1b2c3d4e5f6…',value:token,onChange:e=>{setToken(e.target.value);setError('');},onKeyDown:handleKeyDown,
          style:{width:'100%',height:50,border:'1.5px solid rgba(11,31,40,.14)',borderRadius:10,padding:'0 16px',fontSize:13.5,fontFamily:'Inter,system-ui',color:'#0B1F28',background:'#FAFAF8',letterSpacing:1.2,outline:'none'}
        }),
        error?e('p',{style:{color:'#DC2626',fontSize:12,margin:'8px 0 0',display:'flex',alignItems:'center',gap:5}},'⚠ ',error):null,
        e('button',{onClick:handleLogin,style:{width:'100%',height:50,background:'#0B1F28',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:600,cursor:'pointer',marginTop:16,letterSpacing:.3,fontFamily:'Inter,system-ui'}},'Acessar Portal →'),
        e('div',{style:{display:'flex',alignItems:'center',gap:7,marginTop:32}},
          e('div',{style:{width:5,height:5,borderRadius:'50%',background:'#28A745'}}),
          e('p',{style:{fontSize:11.5,color:'#B4B4AC',margin:0}},'Acesso somente leitura · Dados ao vivo via ClickUp')
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
